<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>מה הבניין הזה מסתיר</title>
<style>
  /* מכללת הנדסאים תל אביב — טורקיז, צהוב, שחור */
  :root {
    --paper:      #FFFFFF;
    --surface:    #F3FAFA;
    --sunk:       #DCEFEF;
    --ink:        #0F1E1E;
    --ink-soft:   #485C5C;
    --ink-faint:  #7B8E8E;
    --rule:       #BCDCDC;
    --rule-soft:  #DCEDED;
    --mark:       #00807F;
    --mark-ink:   #FFFFFF;
    --mark-soft:  #E2F4F4;
    --accent:     #F5D800;
    --accent-ink: #1A1600;
    --head-bg:    #009C9C;
    --head-ink:   #FFFFFF;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper:      #0E1918;
      --surface:    #142423;
      --sunk:       #081110;
      --ink:        #E4F2F1;
      --ink-soft:   #9AB3B2;
      --ink-faint:  #6C8584;
      --rule:       #2B3F3E;
      --rule-soft:  #1B2C2B;
      --mark:       #2ED3D0;
      --mark-ink:   #05100F;
      --mark-soft:  #10302F;
      --accent:     #FFE23D;
      --accent-ink: #1A1600;
      --head-bg:    #00706F;
      --head-ink:   #FFFFFF;
    }
  }
  :root[data-theme="dark"] {
    --paper:      #0E1918;
    --surface:    #142423;
    --sunk:       #081110;
    --ink:        #E4F2F1;
    --ink-soft:   #9AB3B2;
    --ink-faint:  #6C8584;
    --rule:       #2B3F3E;
    --rule-soft:  #1B2C2B;
    --mark:       #2ED3D0;
    --mark-ink:   #05100F;
    --mark-soft:  #10302F;
    --accent:     #FFE23D;
    --accent-ink: #1A1600;
    --head-bg:    #00706F;
    --head-ink:   #FFFFFF;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--sunk);
    color: var(--ink);
    font-family: system-ui, "Segoe UI", "Arial Hebrew", Arial, sans-serif;
    font-size: 17px; line-height: 1.6;
    -webkit-text-size-adjust: 100%;
  }
  .mono {
    font-family: ui-monospace, "SF Mono", "Cascadia Mono", "Consolas", monospace;
    font-variant-numeric: tabular-nums;
  }

  .phone {
    max-width: 27rem; margin: 0 auto; min-height: 100vh;
    background: var(--paper);
    display: flex; flex-direction: column;
    box-shadow: 0 0 0 1px var(--rule);
  }

  .demoflag {
    background: var(--accent); color: var(--accent-ink);
    font-size: 0.72rem; font-weight: 700; letter-spacing: 0.04em;
    text-align: center; padding: 0.45rem 0.8rem; line-height: 1.45;
  }
  .bar {
    position: sticky; top: 0; z-index: 5;
    background: var(--head-bg); color: var(--head-ink);
    padding: 0.75rem 1.1rem;
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
  }
  .bar .who { font-size: 0.82rem; font-weight: 600; letter-spacing: 0.02em; }
  .pips { display: flex; gap: 0.24rem; }
  .pip { width: 0.85rem; height: 4px; background: rgba(255,255,255,0.34); border-radius: 2px; }
  .pip.on { background: var(--accent); }

  main { flex: 1; padding: 1.4rem 1.1rem 3rem; }

  h1 { font-size: 1.8rem; line-height: 1.16; font-weight: 750; letter-spacing: -0.025em; margin: 0 0 0.5rem; text-wrap: balance; }
  h2 { font-size: 1.32rem; line-height: 1.24; font-weight: 700; letter-spacing: -0.018em; margin: 0 0 0.6rem; text-wrap: balance; }
  p { margin: 0 0 0.9rem; }
  p:last-child { margin-bottom: 0; }
  .sub { color: var(--ink-soft); }

  .eyebrow {
    display: inline-block;
    background: var(--mark); color: var(--mark-ink);
    font-size: 0.68rem; font-weight: 700; letter-spacing: 0.1em;
    padding: 0.22rem 0.55rem; border-radius: 3px; margin-bottom: 0.7rem;
  }
  .where {
    font-size: 0.84rem; color: var(--ink-soft);
    border-inline-start: 3px solid var(--accent);
    padding-inline-start: 0.6rem; margin-bottom: 1.1rem;
  }

  .dial { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 1.1rem; margin: 1.1rem 0; }
  .dial + .dial { margin-top: 0.7rem; }
  .dial label { display: block; font-size: 0.85rem; color: var(--ink-soft); margin-bottom: 0.55rem; }
  .readout { font-size: 2.6rem; font-weight: 750; letter-spacing: -0.035em; line-height: 1; color: var(--mark); }
  .readout .u { font-size: 0.95rem; font-weight: 600; color: var(--ink-faint); margin-inline-start: 0.35rem; letter-spacing: 0; }
  input[type=range] { width: 100%; margin: 0.9rem 0 0; accent-color: var(--mark); height: 1.7rem; }
  .ends { display: flex; justify-content: space-between; font-size: 0.72rem; color: var(--ink-faint); }

  .opts { display: flex; flex-direction: column; gap: 0.55rem; margin: 1.1rem 0; }
  .opt {
    display: block; width: 100%; text-align: start;
    background: var(--surface); border: 1.5px solid var(--rule); border-radius: 6px;
    color: var(--ink); padding: 0.9rem 1rem; font: inherit; font-size: 0.98rem; cursor: pointer;
  }
  .opt:hover { border-color: var(--mark); background: var(--mark-soft); }
  .opt:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .opt .k {
    display: inline-block; background: var(--accent); color: var(--accent-ink);
    font-weight: 800; width: 1.5rem; height: 1.5rem; line-height: 1.5rem;
    text-align: center; border-radius: 4px; margin-inline-end: 0.6rem;
  }

  textarea {
    width: 100%; font: inherit; font-size: 1rem; padding: 0.8rem;
    border: 1.5px solid var(--rule); border-radius: 6px;
    background: var(--surface); color: var(--ink);
    min-height: 6rem; resize: vertical; margin: 1.1rem 0 0;
  }
  textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }

  button.go {
    font: inherit; cursor: pointer; border: 0; border-radius: 6px;
    background: var(--mark); color: var(--mark-ink);
    padding: 0.95rem 1.2rem; width: 100%; font-weight: 700; font-size: 1.02rem; margin-top: 1.2rem;
  }
  button.ghost { background: transparent; color: var(--mark); border: 1.5px solid var(--rule); font-weight: 600; }
  button.small { padding: 0.65rem 1rem; font-size: 0.92rem; margin-top: 0.7rem; }
  button.go:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button.go:hover { filter: brightness(1.08); }

  .reveal { animation: rise 0.35s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .reveal { animation: none; } }

  .verdict {
    background: var(--mark-soft); border-radius: 6px;
    border-inline-start: 5px solid var(--mark);
    padding: 1rem 1.1rem; margin-bottom: 1rem;
  }
  .verdict .head { font-weight: 750; margin-bottom: 0.4rem; color: var(--mark); font-size: 1.05rem; }
  .verdict p { font-size: 0.96rem; }

  .facts { list-style: none; margin: 0 0 1rem; padding: 0; display: flex; flex-direction: column; gap: 0.6rem; }
  .facts li { display: grid; grid-template-columns: 4rem 1fr; gap: 0.75rem; align-items: baseline; font-size: 0.95rem; border-bottom: 1px solid var(--rule-soft); padding-bottom: 0.6rem; }
  .facts li:last-child { border-bottom: 0; }
  .facts .k {
    font-size: 0.82rem; font-weight: 700; color: var(--accent-ink);
    background: var(--accent); border-radius: 3px; padding: 0.15rem 0.35rem; text-align: center;
  }

  .unlock {
    background: var(--accent); color: var(--accent-ink);
    border-radius: 6px; padding: 1.05rem 1.1rem; margin-bottom: 1rem;
  }
  .unlock .tag { font-size: 0.66rem; font-weight: 800; letter-spacing: 0.14em; margin-bottom: 0.35rem; opacity: 0.72; }
  .unlock h3 { margin: 0 0 0.35rem; font-size: 1.1rem; font-weight: 800; }
  .unlock p { font-size: 0.94rem; }

  .qa { border-top: 2px solid var(--mark); }
  details { border-bottom: 1px solid var(--rule-soft); }
  summary { cursor: pointer; padding: 0.85rem 0.2rem; font-weight: 650; font-size: 0.98rem; list-style: none; display: flex; gap: 0.7rem; align-items: baseline; }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "+"; color: var(--mark); font-weight: 800; }
  details[open] summary::before { content: "–"; }
  summary:focus-visible { outline: 3px solid var(--accent); outline-offset: -2px; }
  details .body { padding: 0 0.2rem 1rem 1.6rem; font-size: 0.95rem; color: var(--ink-soft); }
  details .body p { margin-bottom: 0.7rem; }
  details .body ul { margin: 0 0 0.7rem; padding-inline-start: 1.1rem; }
  details .body li { margin-bottom: 0.3rem; }
  .missing { display: inline-block; background: var(--accent); color: var(--accent-ink); font-weight: 700; padding: 0.15rem 0.45rem; border-radius: 3px; font-size: 0.76rem; }

  .score { background: var(--mark); color: var(--mark-ink); border-radius: 8px; padding: 1.3rem 1.1rem; text-align: center; margin-bottom: 1.3rem; }
  .score .n { font-size: 3.1rem; font-weight: 800; letter-spacing: -0.04em; line-height: 1; color: var(--accent); }
  .score .l { font-size: 0.8rem; letter-spacing: 0.1em; margin-top: 0.35rem; opacity: 0.9; }

  .form { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 1.1rem; }
  .form label { display: block; font-size: 0.82rem; color: var(--ink-soft); margin: 0.7rem 0 0.3rem; }
  .form input[type=text], .form input[type=tel] { width: 100%; font: inherit; font-size: 0.95rem; padding: 0.65rem 0.7rem; border: 1.5px solid var(--rule); border-radius: 5px; background: var(--paper); color: var(--ink); }
  .consent { display: grid; grid-template-columns: auto 1fr; gap: 0.6rem; align-items: start; font-size: 0.85rem; color: var(--ink-soft); margin-top: 0.9rem; }

  .contact { background: var(--mark-soft); border-radius: 6px; padding: 1rem 1.1rem; margin-top: 1.3rem; font-size: 0.93rem; }
  .contact div { margin-bottom: 0.5rem; }
  .contact div:last-child { margin-bottom: 0; }
  .contact b { font-weight: 750; color: var(--mark); }

  .footnote { font-size: 0.82rem; color: var(--ink-faint); margin-top: 1.5rem; border-top: 1px solid var(--rule); padding-top: 0.9rem; }
</style>
</head>
<body>

<div class="phone">
  <div class="demoflag">מהכניסה הראשית עד אולם שביט · 8 תחנות · בערך חצי שעה</div>
  <div class="bar">
    <span class="who mono" id="crumb">מה הבניין הזה מסתיר</span>
    <span class="pips" id="pips"></span>
  </div>
  <main id="view"></main>
</div>

<script>
(function () {
  "use strict";

  var S = [
    /* ---------------------------------------------------------- 1 */
    {
      type: "slider", key: "eye", name: "גובה העיניים",
      where: "הקיר משמאל לעמדת השומר",
      task: "עמוד צמוד לקיר וסמן את גובה העיניים שלך. כמה יצא?",
      label: "גובה העיניים שלי", unit: 'ס״מ',
      min: 130, max: 195, start: 160, step: 1,
      verdict: function (v) {
        return { head: "קו העין שלך: " + v + " ס״מ",
          text: "כל בניין שהיית בו אי פעם תוכנן סביב המספר הזה של מישהו אחר. מהרגע הזה הגוף שלך הוא הסרגל." };
      },
      facts: function (v) {
        return [
          ["280", "גובה התקרה כאן, בכניסה. " + (280 - v) + " ס״מ מעל קו העין שלך — וזה מה שגורם לכניסה להרגיש פתוחה."],
          ["105", "גובה ידית דלת תקנית. נקבע לפי היד, ולכן הוא זהה לכולם — נמוכים וגבוהים."],
          ["190", v >= 190 ? "מדף עליון במטבח. אתה רואה מה מונח עליו."
                           : "מדף עליון במטבח. אתה לא רואה מה מונח עליו — ולכן, בפועל, לא תשתמש בו."]
        ];
      },
      unlock: { course: "הנדסת אנוש", text: "מקצוע רקע בתוכנית. זה בדיוק מה שהוא עושה: להתאים את המרחב למידות של גוף אמיתי, לפני שמדברים על צבע או על סגנון." }
    },

    /* ---------------------------------------------------------- 2 */
    {
      type: "slider", key: "corridor", name: "מסדרון הכניסה",
      where: "מסדרון הכניסה",
      task: "מדוד את רוחב המסדרון בעקב־אצבע, ותרגם לסנטימטרים. כמה יצא?",
      label: "רוחב המסדרון", unit: 'ס״מ',
      min: 90, max: 320, start: 160, step: 5,
      verdict: function (v) {
        var real = 252, gap = Math.abs(v - real);
        if (gap <= 20) return { head: "252 ס״מ — קלעת", text: "רוב האנשים מעריכים הרבה פחות. אנחנו לא מודדים מרחקים בעיניים כמעט אף פעם." };
        if (v < real) return { head: "252 ס״מ — הערכת בחסר", text: "כמעט כולם. המוח שלנו משווה למסדרון של דירה, וכאן הוא כפול ממנו." };
        return { head: "252 ס״מ — הערכת ביתר", text: "המסדרון באמת מרגיש רחב, ויש לזה סיבה." };
      },
      facts: function () {
        return [
          ["110", "רוחב מסדרון טיפוסי בדירה. כאן יותר מכפול."],
          ["למה", "זה מבנה ציבור. הרוחב נקבע לפי כמה אנשים צריכים לפנות אותו בחירום, ולפי כיסא גלגלים שצריך להסתובב בו — לא לפי נוחות."],
          ["340", "גובה התקרה כאן, לעומת 280 בכניסה. שים לב שהרגשת את ההבדל לפני שידעת את המספר."]
        ];
      },
      unlock: { course: "תחיקת הבניה והבטיחות", text: "מקצוע רקע בתוכנית. רוחב מסדרון הוא לא העדפה של מתכנן — הוא תנאי לקבלת היתר. הרבה ממה שנראה כמו טעם הוא בעצם חוק." }
    },

    /* ---------------------------------------------------------- 3 */
    {
      type: "text", key: "compromise", name: "איפה מישהו התפשר",
      where: "באזור המדרגות והפאטיו",
      task: "הסתכל סביב: הקירוי מעל המדרגות, המפגש שלו עם הקיר, הצנרת, המבנה היביל בפאטיו. מצא מקום אחד שניכר בו שמישהו נאלץ להתפשר, וכתוב בשורה מה ראית.",
      placeholder: "לדוגמה: הקירוי לא נפגש נקי עם הקיר…",
      verdict: function () {
        return { head: "אין כאן תשובה נכונה", text: "וזה לא ויתור — זו הנקודה. כל בניין הוא רצף פשרות בין מה שרצו, מה שמותר, מה שאפשר לבנות ומה שהיה עליו תקציב." };
      },
      facts: function () {
        return [
          ["הכי נפוץ", "אלמנט שנוסף אחרי שהבניין כבר עמד — קירוי, צנרת או מזגן. הוא כמעט לעולם לא נפגש נקי עם מה שהיה קודם."],
          ["למה", "בשלב התכנון זה היה קו על נייר. בשטח מתגלה שהקיר לא ישר, שהצינור עובר, ושאין תקציב לפרק ולהתחיל מחדש."],
          ["השורה", "מקצוען הוא לא מי שלא מתפשר. הוא מי שיודע מראש איפה כדאי — ומה זה יעלה אם יגלו את זה מאוחר."]
        ];
      },
      unlock: { course: "עקרונות התכנון האדריכלי", text: "מקצוע התמחות, ומרכז הסטודיו לתכנון. שם לומדים לקבל את ההחלטות האלה בזמן — על הנייר, כשהן עדיין עולות אפס." }
    },

    /* ---------------------------------------------------------- 4 */
    {
      type: "choice", key: "light", name: "מאיפה מגיע האור",
      where: "הפתח הפונה לפאטיו",
      task: "הסתכל על החצר. מול העין קיר האפור של פיר המעליות. לאיזה כיוון פונה הפתח שאתה עומד בו? תסתכל על הצללים בחצר, על הצד שמתחמם, ועל איפה בחרו לפרוס את השמשיות.",
      options: [
        { v: "n", t: "צפון" }, { v: "s", t: "דרום" },
        { v: "e", t: "מזרח" }, { v: "w", t: "מערב" }
      ],
      verdict: function (v) {
        var m = {
          n: ["צפון", "אור קבוע ורך לאורך כל היום, בלי שמש ישירה ובלי סנוור. בדיוק בגלל זה סטודיו לתכנון מנסים תמיד להפנות צפונה."],
          s: ["דרום", "השמש גבוהה בקיץ ונמוכה בחורף. זה הכיוון היחיד שאפשר להצל עליו במדף אופקי פשוט — וזה חוסך מזגן."],
          e: ["מזרח", "שמש בבוקר, ואז כלום. חלל שמתעורר מוקדם ומתקרר בצהריים."],
          w: ["מערב", "השמש הנמוכה של אחר הצהריים. מסנוורת ומחממת יותר מכל כיוון אחר, והכי קשה להתגונן ממנה."]
        }[v];
        return { head: "ענית: " + m[0], text: m[1] };
      },
      facts: function () {
        return [
          ["עכשיו בדוק", "פתח את המצפן בטלפון ותראה אם צדקת. אם טעית — זה הרבה יותר מעניין, כי עכשיו יש לך סיבה לשאול למה זה הרגיש אחרת."],
          ["הבדיקה בלי טלפון", "צל קצר בצהריים = השמש מעליך, כלומר אתה מסתכל דרומה. צל ארוך שנמתח לצד אחד = בוקר או אחר צהריים."],
          ["בחצר הזאת", "השמשיות והישיבה לא פרוסות באקראי. מישהו כבר גילה איפה נעים לשבת בשתיים בצהריים — וזה הסימן הכי טוב לכיוון."]
        ];
      },
      unlock: { course: "תכנון אקלים ובניה ירוקה", text: "מקצוע התמחות בתוכנית, ואחד התפקידים שבוגר יכול לעסוק בהם כיועץ עצמאי. כיוון הוא ההחלטה היחידה בתכנון שלא עולה שקל, ומשפיעה על חשבון החשמל של הבניין לכל אורך חייו." }
    },

    /* ---------------------------------------------------------- 5 */
    {
      type: "dual", key: "stairs", name: "המדרגות לפאטיו",
      where: "גרם המדרגות היורד לפאטיו",
      task: "מדוד מדרגה אחת. הרום הוא הגובה שאתה עולה, השלח הוא העומק שאתה דורך עליו.",
      label: "רום (גובה)", label2: "שלח (עומק)", unit: 'ס״מ',
      min: 12, max: 22, start: 17, step: 0.5,
      min2: 20, max2: 36, start2: 28, step2: 1,
      verdict: function (v, v2) {
        var s = 2 * v + v2;
        if (s >= 61 && s <= 65) return { head: "לפי הנוסחה: " + s.toFixed(1) + " ס״מ, בטווח הנוח", text: "אתה עולה בגרם כזה בלי לחשוב עליו אפילו פעם אחת." };
        if (s < 61) return { head: "לפי הנוסחה: " + s.toFixed(1) + " ס״מ, שטוח", text: "הצעד יוצא קצר וקטוע. תרגיש שאתה מדדה במקום לעלות." };
        return { head: "לפי הנוסחה: " + s.toFixed(1) + " ס״מ, תלול", text: "בקומה הראשונה זה בסדר. בשלישית תרגיש את זה בשוקיים." };
      },
      facts: function () {
        return [
          ["16 / 26", "המידות האמיתיות של הגרם הזה. מציבים בנוסחה: 2×16+26 = 58 ס״מ."],
          ["58", "מתחת לטווח הנוח שהוא 61 עד 65. הגרם הזה שטוח מהמומלץ — ועכשיו, כשאתה יורד בו, אתה תרגיש את זה."],
          ["למה", "מדרגות חוץ נעשות לרוב שטוחות בכוונה: הן רטובות בחורף, והצעד הארוך בטוח יותר. כל מספר כאן הוא הכרעה, לא מקריות."]
        ];

    },

    /* ---------------------------------------------------------- 6 */
    {
      type: "choice", key: "materials", name: "לזהות חומר ביד",
      where: "הארון הצהוב ליד אולם שביט",
      task: "בארון יש דוגמאות חומרים. קח שלוש ביד ומצא: אחת שאפשר לשרוט בציפורן, אחת שקרה למגע, ואחת שקלה בהרבה ממה שהיא נראית. מה מכל השלושה הפתיע אותך יותר?",

        { v: "light", t: "כמה קלה הייתה אחת מהן" }
      ],
      verdict: function (v) {
        var m = {
          scratch: ["השריטה", "אם ציפורן שורטת אותו, גם מפתח, גם כיסא, גם מזוודה. זה החומר שייראה מעולה בהדמיה ומרוט אחרי שנתיים במסדרון."],
          cold: ["הקור", "החומר לא קר. הוא מוליך את החום מכף היד שלך במהירות. אותו חומר בדיוק על רצפה בחורף מרגיש בלתי נסבל, ובקיץ מושלם."],

        return [
          ["קשיות", "קובעת איפה החומר ישרוד — רצפה, קיר מסדרון, או מדף שאף אחד לא נוגע בו."],
          ["מוליכות", "קובעת אם יהיה נעים לגעת בו, וכמה תעבוד המערכת שמחממת או מקררת את החדר."],
          ["צפיפות", "קובעת מי נושא את מי. חומר קל לא מחזיק כלום, וחומר כבד דורש שמשהו יחזיק אותו."],

        ];
      },
      unlock: { course: "חומרי בנין · פרטי בנין", text: "שני מקצועות התמחות בתוכנית. ההבדל בין החומר הנכון לחומר היפה הוא ההבדל בין פרויקט שנראה טוב ביום המסירה לפרויקט שנראה טוב אחרי חמש שנים." }
    },

    /* ---------------------------------------------------------- 7 */
    {
      type: "choice", key: "works", name: "עבודות הסטודנטים",
      where: "קיר העבודות באולם שביט",
      task: "על הקיר שלוש עבודות, מסומנות א׳, ב׳ ו־ג׳. בחר אחת שהיית רוצה שתהיה שלך.",
      options: [
        { v: "a", t: "עבודה א׳" }, { v: "b", t: "עבודה ב׳" }, { v: "c", t: "עבודה ג׳" }
      ],
      verdict: function () {

      },

    /* ---------------------------------------------------------- 8 */
    {
      type: "slider", key: "systems", name: "מה מסתתר בתקרה",
      where: "אולם שביט",

      label: "ספרתי", unit: "מערכות",
      min: 1, max: 12, start: 4, step: 1,

        if (v <= 3) return { head: "יש שם יותר", text: "כמעט כולם עונים בין שתיים לארבע. זה בדיוק העניין: התקרה היא החלק בבניין שאף אחד לא מסתכל עליו, והיא הצפופה ביותר." };
        if (v <= 7) return { head: "עין טובה", text: "ראית יותר מהממוצע. עכשיו תסתכל שוב ותנסה למצוא עוד שתיים — הן שם." };
        return { head: "מצוין", text: "אתה כבר מסתכל על תקרה כמו מי שצריך לתכנן אותה." };
      },
      facts: function () {
        return [
          ["תאורה", "לא רק גופים — גם מפסקים, מעגלים, ותאורת חירום שחייבת לעבוד כשהחשמל נופל."],
          ["גילוי אש", "גלאי עשן, ולעיתים ספרינקלרים. המיקום שלהם נקבע בתקן, לא בשרטוט העיצובי."],
          ["מיזוג", "מפוחים, תעלות ומפזרים. התעלה היא הדבר הכי עבה בתקרה, והיא זו שקובעת כמה נמוך יהיה הגבס."],

  var state = { i: -1, phase: "task", vals: {}, done: [] };
  try {
    var saved = JSON.parse(localStorage.getItem("cts-hunt-v2") || "null");
    if (saved && typeof saved.i === "number") state = saved;
  } catch (e) {}
  function save() { try { localStorage.setItem("cts-hunt-v2", JSON.stringify(state)); } catch (e) {} }

  var view = document.getElementById("view"),
      pips = document.getElementById("pips"),
      crumb = document.getElementById("crumb");

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function fmt(n) { return Number(n).toLocaleString("en-US"); }

  function drawPips() {
    var h = "";
    for (var i = 0; i < S.length; i++) h += '<span class="pip' + (state.done.indexOf(i) > -1 ? " on" : "") + '"></span>';
    pips.innerHTML = h;
  }

  function render() {
    drawPips();
    if (state.i < 0) return intro();
    if (state.i >= S.length) return finish();
    var st = S[state.i];
    crumb.textContent = st.name;
    if (state.phase === "task") task(st); else reveal(st);
    window.scrollTo(0, 0);
  }

  function intro() {
    crumb.textContent = "מה הבניין הזה מסתיר";
    view.innerHTML =
      '<div class="eyebrow mono">מכללת הנדסאים תל אביב · מגמת אדריכלות ועיצוב פנים</div>' +
      '<h1>מה הבניין הזה מסתיר</h1>' +
      '<p class="sub">שמונה תחנות בתוך הבניין, בערך חצי שעה, לבד או בזוג. אין שעת התחלה — מתחילים מתי שרוצים, מפסיקים באמצע, וחוזרים.</p>' +
      '<div class="verdict"><div class="head">אין כאן אף שאלה של ידע.</div>' +
      '<p>כל תחנה נפתרת בעיניים, ברגליים ובהיגיון. מי שלא יודע דבר על אדריכלות פותר את כולן — וזה לא צירוף מקרים. זה מה שהמקצוע באמת עושה.</p></div>' +
      '<button class="go" id="go">התחל</button>' +
      '<button class="go ghost small" id="skipq">רק תגידו לי מה לומדים כאן</button>' +
      '<p class="footnote">כרגע זו גרסת עבודה — אפשר לענות מכל מקום, פשוט תנחש. במסלול האמיתי כל תחנה נפתחת בסריקת ברקוד במקומה בבניין.</p>';
    document.getElementById("go").onclick = function () { state.i = 0; state.phase = "task"; save(); render(); };
    document.getElementById("skipq").onclick = function () { state.i = S.length; save(); render(); };
  }

  function shell(st, inner) {
    return '<div class="eyebrow mono">תחנה ' + (state.i + 1) + ' מתוך ' + S.length + '</div>' +
           '<h2>' + esc(st.name) + '</h2>' +
           '<div class="where">' + esc(st.where) + '</div>' +
           '<p>' + esc(st.task) + '</p>' + inner;
  }

  function commit(st, val, val2) {
    state.vals[st.key] = val;
    if (val2 !== undefined) state.vals[st.key + "2"] = val2;
    state.phase = "reveal";
    if (state.done.indexOf(state.i) === -1) state.done.push(state.i);
    save(); render();
  }

  function task(st) {
    var money = st.unit === "₪";

    if (st.type === "choice") {
      var h = "<div class='opts'>";
      st.options.forEach(function (o, n) {
        h += '<button class="opt" data-v="' + o.v + '"><span class="k mono">' + String.fromCharCode(1488 + n) + '</span>' + esc(o.t) + '</button>';
      });
      h += "</div>";
      view.innerHTML = shell(st, h);
      Array.prototype.forEach.call(view.querySelectorAll(".opt"), function (b) {
        b.onclick = function () { commit(st, b.getAttribute("data-v")); };
      });
      return;
    }

    if (st.type === "text") {
      view.innerHTML = shell(st,
        '<textarea id="t" placeholder="' + esc(st.placeholder) + '" aria-label="מה ראית"></textarea>' +
        '<button class="go" id="ok">זהו</button>');
      document.getElementById("ok").onclick = function () {
        commit(st, document.getElementById("t").value.trim());
      };
      return;
    }

    var v = state.vals[st.key] !== undefined ? state.vals[st.key] : st.start;
    var v2 = state.vals[st.key + "2"] !== undefined ? state.vals[st.key + "2"] : st.start2;

    var h = '<div class="dial">' +
      '<label for="a">' + esc(st.label) + '</label>' +
      '<div class="readout mono" id="ra">' + (money ? fmt(v) : v) + '<span class="u">' + st.unit + '</span></div>' +
      '<input type="range" id="a" min="' + st.min + '" max="' + st.max + '" step="' + st.step + '" value="' + v + '" aria-label="' + esc(st.label) + '">' +
      '<div class="ends mono"><span>' + (money ? fmt(st.min) : st.min) + '</span><span>' + (money ? fmt(st.max) : st.max) + '</span></div></div>';

    if (st.type === "dual") {
      h += '<div class="dial">' +
        '<label for="b">' + esc(st.label2) + '</label>' +
        '<div class="readout mono" id="rb">' + v2 + '<span class="u">' + st.unit + '</span></div>' +
        '<input type="range" id="b" min="' + st.min2 + '" max="' + st.max2 + '" step="' + st.step2 + '" value="' + v2 + '" aria-label="' + esc(st.label2) + '">' +
        '<div class="ends mono"><span>' + st.min2 + '</span><span>' + st.max2 + '</span></div></div>';
    }

    h += '<button class="go" id="ok">זהו, בדוק</button>';
    view.innerHTML = shell(st, h);

    var a = document.getElementById("a"), ra = document.getElementById("ra");
    a.oninput = function () { ra.firstChild.nodeValue = money ? fmt(a.value) : a.value; };
    if (st.type === "dual") {
      var b = document.getElementById("b"), rb = document.getElementById("rb");
      b.oninput = function () { rb.firstChild.nodeValue = b.value; };
    }
    document.getElementById("ok").onclick = function () {
      commit(st, parseFloat(a.value), st.type === "dual" ? parseFloat(document.getElementById("b").value) : undefined);
    };
  }

  function reveal(st) {
    var v = state.vals[st.key], v2 = state.vals[st.key + "2"];
    var vd = st.verdict(v, v2);

    var h = '<div class="reveal"><div class="eyebrow mono">מה שבאמת קורה כאן</div>' +
      '<div class="verdict"><div class="head">' + esc(vd.head) + '</div><p>' + esc(vd.text) + '</p></div>';

    if (st.facts) {
      h += '<ul class="facts">';
      st.facts(v, v2).forEach(function (f) {
        h += '<li><span class="k mono">' + esc(f[0]) + '</span><span>' + esc(f[1]) + '</span></li>';
      });
      h += '</ul>';
    }

    if (st.split) {
      h += '<div class="split">';
      var max = Math.max.apply(null, st.split.map(function (r) { return r[1]; }));
      st.split.forEach(function (r) {
        var hot = r[0] === "עיצוב";
        h += '<div class="row' + (hot ? " hot" : "") + '"><div class="track">' +
          '<div class="fill" style="width:' + (r[1] / max * 100) + '%"></div>' +
          '<div class="lab">' + esc(r[0]) + '</div></div>' +
          '<div class="pct mono">' + r[1] + '%</div></div>';
      });
      h += '</div>';
    }

    h += '<div class="unlock"><div class="tag mono">נפתח לך</div><h3>' + esc(st.unlock.course) + '</h3>' +
      '<p>' + esc(st.unlock.text) + '</p></div>' +
      '<button class="go" id="next">' + (state.i === S.length - 1 ? "סיימתי את המסלול" : "לתחנה הבאה") + '</button></div>';

    view.innerHTML = h;
    document.getElementById("next").onclick = function () { state.i++; state.phase = "task"; save(); render(); };
  }

  function q(title, body) {
    return '<details><summary>' + title + '</summary><div class="body">' + body + '</div></details>';
  }

  function finish() {
    crumb.textContent = "סיום";
    view.innerHTML =
      '<div class="score"><div class="n mono">' + state.done.length + '/' + S.length + '</div><div class="l mono">תחנות</div></div>' +
      '<h2>עכשיו השאלות שלא נעים לשאול</h2>' +
      '<p class="sub">הכל כתוב כאן במפורש, עם מספרים, בלי לשלוח אותך לשיחה עם נציג.</p>' +

      '<div class="qa">' +
        q("צריך לדעת לצייר?",
          "<p>יש מבחן מיון באדריכלות וראיון אישי בכניסה — הם בודקים תפיסה מרחבית, לא כישרון ציור.</p>" +
          "<p>את השרטוט עצמו לומדים כאן: יסודות המרחב, שרטוט אדריכלי, תוכנות תלת־ממד. שלוש העבודות שראית על הקיר בתחנה 7 נעשו בסמסטר הראשון.</p>") +

        q("כמה זמן זה לוקח?",
          "<p><b>מסלול בוקר:</b> שנתיים וחצי, חמישה סמסטרים, ארבעה ימים בשבוע.</p>" +
          "<p><b>מסלול ערב משולב:</b> שלוש שנים, שמונה סמסטרים כולל שני סמסטרי קיץ — שלושה אחר־צהריים־ערב ובוקר יום שישי, או ארבעה אחר־צהריים־ערב.</p>") +

        q("אפשר לעבוד תוך כדי?",
          "<p>זו בדיוק הסיבה שקיים מסלול הערב המשולב. המחיר הוא חצי שנה נוספת ושני סמסטרי קיץ.</p>") +

        q("אני אחרי צבא. מה עם מילואים?",
          "<p>למכללה יש מנגנון ולת״ם לסטודנטים שזומנו למילואים, דרך הדקנאט — יחד עם מלגות, טיפוח כישורי למידה והכוונה תעסוקתית.</p>" +
          "<p><span class=\"missing mono\">להשלמה מהמכללה</span> הפירוט המדויק של ההתאמות והמלגות.</p>") +

        q("מה אני מקבל בסוף, בפועל?",
          "<p>דיפלומת הנדסאי אדריכלות ועיצוב פנים מטעם מה״ט, והרשמה בפנקס ההנדסאים.</p>" +
          "<p>מה זה אומר מעשית: אתה רשאי לתכנן מבנים עד ארבע קומות, בגובה של עד 11.5 מטר. זו לא תעודת השתתפות — זו הסמכה עם סמכות חתימה.</p>") +

        q("מה עושים עם זה אחר כך?",
          "<ul>" +
          "<li>תכנון במשרדי אדריכלות</li>" +
          "<li>פרקטיקה עצמאית לתכנון אדריכלי</li>" +
          "<li>התמחות בעיצוב פנים</li>" +
          "<li>ועדות תכנון ברשויות המקומיות</li>" +
          "<li>ייעוץ אקלים ובנייה ירוקה</li>" +
          "<li>ייעוץ נגישות בבנייה ציבורית</li>" +
          "</ul>") +

        q("כמה זה קשה, באמת?",
          "<p>לא נעים אבל עדיף שתדע: חייבים לעבור בציון חיובי את כל הקורסים כדי להתקדם לסמסטר הבא. ציון עובר בסטודיו לתכנון אדריכלי הוא 60, וכישלון במקצוע אחד עלול לעכב את המשך הלימודים.</p>" +
          "<p>לפני פרויקט הגמר צריך לעמוד בבחינות הממלכתיות של מה״ט. המגמה מכוונת לממוצע מעל 85.</p>" +
          "<p>אם זה נשמע לך רציני מדי — זה בדיוק מה שהופך את התעודה לשווה משהו.</p>") +

        q("צריך בגרות מלאה?",
          "<p>לא בהכרח. מתקבלים גם עם בגרות חלקית בציון 55 ומעלה עם שלוש יחידות מתמטיקה ושלוש יחידות אנגלית, עם תעודת מכינה טכנולוגית (660 שעות), או עם תעודת טכנאי מוסמך או תואר ראשון.</p>" +
          "<p>בכל המסלולים נדרשים גם מבחן מיון וראיון אישי.</p>") +

        q("כמה זה עולה?",
          "<p><span class=\"missing mono\">להשלמה מהמכללה</span></p>" +
          "<p>שכר הלימוד, המלגות ופריסת התשלומים נמסרים על ידי מדור ההרשמה של המכללה — לא על ידי המגמה. השאירו פרטים למטה ויחזרו אליכם עם המספרים המדויקים.</p>") +

        q("כמה מרוויח בוגר בשנה הראשונה?",
          "<p><span class=\"missing mono\">להשלמה מהמכללה</span></p>" +
          "<p>טווח שכר אמיתי, ומי מעסיק בוגרים.</p>") +

        q("אני בן 26. כולם יהיו בני 21?",
          "<p><span class=\"missing mono\">להשלמה מהמכללה</span></p>" +
          "<p>התפלגות הגילים בכיתה. אם רוב הכיתה היא אחרי צבא, זו אחת התשובות המרגיעות ביותר שאפשר לתת — והיא פשוט לא נאמרת היום.</p>") +

        q("ומה עם AI? למה ללמוד את זה בכלל?",
          "<p>בתוכנית יש קורס בשם אנגלית לאדריכלות + AI, אז השאלה לא מודחקת כאן.</p>" +
          "<p>והתשובה הישרה: AI מייצר תמונה יפה של חלל תוך שניות. הוא לא יודע איפה עובר העמוד, מה מותר בהיתר, כמה עולה לעבור עם צנרת, ומי חותם על זה. כל מה שעברת עכשיו בשמונה התחנות — זה החלק שהוא לא עושה.</p>") +
      '</div>' +

      '<h2 style="margin-top:2rem">רוצה שנמשיך?</h2>' +
      '<div class="form">' +
        '<label for="nm">שם</label><input type="text" id="nm" autocomplete="name">' +

    document.getElementById("send").onclick = function () { this.textContent = "בגרסה הזו זה לא נשלח"; this.disabled = true; };

      state = { i: -1, phase: "task", vals: {}, done: [] }; save(); render();

  var deep = (location.search + location.hash).match(/[?&#]s=(\d+)/);
  if (deep) {
    var k = parseInt(deep[1], 10) - 1;
    if (k >= 0 && k < S.length) { state.i = k; state.phase = "task"; save(); }
  }

  render();
