<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>מה הבניין הזה מסתיר</title>
<style>
  :root {
    --paper:      #F1F2EE;
    --surface:    #FBFBF9;
    --sunk:       #E7E9E3;
    --ink:        #1A1E1C;
    --ink-soft:   #5D6663;
    --ink-faint:  #8A928E;
    --rule:       #C9CDC6;
    --rule-soft:  #DFE2DC;
    --mark:       #D6431B;
    --mark-ink:   #FFFFFF;
    --mark-soft:  #F6E2DA;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper:     #16191A;
      --surface:   #1D2122;
      --sunk:      #121516;
      --ink:       #E8EAE6;
      --ink-soft:  #9AA39F;
      --ink-faint: #6E7874;
      --rule:      #333A3B;
      --rule-soft: #262B2C;
      --mark:      #FF6636;
      --mark-ink:  #14100E;
      --mark-soft: #33201A;
    }
  }
  :root[data-theme="dark"] {
    --paper:     #16191A;
    --surface:   #1D2122;
    --sunk:      #121516;
    --ink:       #E8EAE6;
    --ink-soft:  #9AA39F;
    --ink-faint: #6E7874;
    --rule:      #333A3B;
    --rule-soft: #262B2C;
    --mark:      #FF6636;
    --mark-ink:  #14100E;
    --mark-soft: #33201A;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--sunk);
    color: var(--ink);
    font-family: system-ui, "Segoe UI", "Arial Hebrew", Arial, sans-serif;
    font-size: 17px;
    line-height: 1.6;
    -webkit-text-size-adjust: 100%;
  }
  .mono {
    font-family: ui-monospace, "SF Mono", "Cascadia Mono", "Consolas", monospace;
    font-variant-numeric: tabular-nums;
  }

  .phone {
    max-width: 27rem;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--paper);
    border-inline: 1px solid var(--rule);
    display: flex;
    flex-direction: column;
  }

  .demoflag {
    background: var(--mark);
    color: var(--mark-ink);
    font-size: 0.7rem;
    letter-spacing: 0.07em;
    text-align: center;
    padding: 0.4rem 0.8rem;
    line-height: 1.45;
  }
  .bar {
    position: sticky; top: 0; z-index: 5;
    background: var(--paper);
    border-bottom: 1px solid var(--rule);
    padding: 0.7rem 1.1rem;
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
  }
  .bar .who { font-size: 0.78rem; color: var(--ink-faint); letter-spacing: 0.05em; }
  .pips { display: flex; gap: 0.22rem; }
  .pip { width: 0.85rem; height: 3px; background: var(--rule); }
  .pip.on { background: var(--mark); }

  main { flex: 1; padding: 1.4rem 1.1rem 3rem; }

  h1 { font-size: 1.75rem; line-height: 1.18; font-weight: 650; letter-spacing: -0.02em; margin: 0 0 0.5rem; text-wrap: balance; }
  h2 { font-size: 1.3rem; line-height: 1.25; font-weight: 640; letter-spacing: -0.015em; margin: 0 0 0.6rem; text-wrap: balance; }
  p { margin: 0 0 0.9rem; }
  p:last-child { margin-bottom: 0; }
  .sub { color: var(--ink-soft); }
  .eyebrow { font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--mark); margin-bottom: 0.55rem; }
  .where { font-size: 0.82rem; color: var(--ink-faint); border-inline-start: 2px solid var(--rule); padding-inline-start: 0.6rem; margin-bottom: 1.1rem; }

  .dial { background: var(--surface); border: 1px solid var(--rule); padding: 1.1rem; margin: 1.1rem 0; }
  .dial + .dial { margin-top: 0.7rem; }
  .dial label { display: block; font-size: 0.85rem; color: var(--ink-soft); margin-bottom: 0.55rem; }
  .readout { font-size: 2.5rem; font-weight: 600; letter-spacing: -0.03em; line-height: 1; }
  .readout .u { font-size: 0.95rem; font-weight: 500; color: var(--ink-faint); margin-inline-start: 0.35rem; letter-spacing: 0; }
  input[type=range] { width: 100%; margin: 0.9rem 0 0; accent-color: var(--mark); height: 1.6rem; }
  .ends { display: flex; justify-content: space-between; font-size: 0.72rem; color: var(--ink-faint); }

  .opts { display: flex; flex-direction: column; gap: 0.5rem; margin: 1.1rem 0; }
  .opt {
    display: block; width: 100%; text-align: start;
    background: var(--surface); border: 1px solid var(--rule); color: var(--ink);
    padding: 0.85rem 1rem; font: inherit; font-size: 0.98rem; cursor: pointer;
  }
  .opt:hover { border-color: var(--mark); }
  .opt:focus-visible { outline: 2px solid var(--mark); outline-offset: 2px; }
  .opt .k { color: var(--mark); font-weight: 640; margin-inline-end: 0.55rem; }

  textarea {
    width: 100%; font: inherit; font-size: 1rem; padding: 0.8rem;
    border: 1px solid var(--rule); background: var(--surface); color: var(--ink);
    min-height: 6rem; resize: vertical; margin: 1.1rem 0 0;
  }
  textarea:focus-visible { outline: 2px solid var(--mark); outline-offset: 1px; }

  button.go {
    font: inherit; cursor: pointer; border: 1px solid var(--ink);
    background: var(--ink); color: var(--paper);
    padding: 0.85rem 1.2rem; width: 100%; font-weight: 600; font-size: 1rem; margin-top: 1.2rem;
  }
  button.ghost { background: transparent; color: var(--ink); border-color: var(--rule); font-weight: 550; }
  button.small { padding: 0.6rem 1rem; font-size: 0.9rem; margin-top: 0.7rem; }
  button.go:focus-visible { outline: 2px solid var(--mark); outline-offset: 2px; }
  button.go:hover { opacity: 0.88; }

  .reveal { animation: rise 0.35s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .reveal { animation: none; } }

  .verdict { border: 1px solid var(--rule); border-inline-start: 3px solid var(--mark); background: var(--surface); padding: 1rem 1.1rem; margin-bottom: 1rem; }
  .verdict .head { font-weight: 640; margin-bottom: 0.4rem; }
  .verdict p { font-size: 0.96rem; }

  .facts { list-style: none; margin: 0 0 1rem; padding: 0; display: flex; flex-direction: column; gap: 0.6rem; }
  .facts li { display: grid; grid-template-columns: 3.7rem 1fr; gap: 0.75rem; align-items: baseline; font-size: 0.95rem; border-bottom: 1px solid var(--rule-soft); padding-bottom: 0.6rem; }
  .facts li:last-child { border-bottom: 0; }
  .facts .k { font-size: 0.85rem; color: var(--mark); }

  .unlock { background: var(--mark-soft); border: 1px solid var(--rule); padding: 1rem 1.1rem; margin-bottom: 1rem; }
  .unlock .tag { font-size: 0.66rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--mark); margin-bottom: 0.35rem; }
  .unlock h3 { margin: 0 0 0.35rem; font-size: 1.05rem; font-weight: 640; }
  .unlock p { font-size: 0.94rem; }

  .split { display: flex; flex-direction: column; gap: 0.5rem; margin: 1rem 0; }
  .row { display: grid; grid-template-columns: 1fr 3.2rem; gap: 0.6rem; align-items: center; font-size: 0.88rem; }
  .row .track { background: var(--sunk); height: 1.55rem; position: relative; overflow: hidden; }
  .row .fill { position: absolute; inset-block: 0; inset-inline-start: 0; background: var(--rule); }
  .row.hot .fill { background: var(--mark); }
  .row .lab { position: absolute; inset-block: 0; inset-inline-start: 0.5rem; display: flex; align-items: center; white-space: nowrap; }
  .row .pct { text-align: start; color: var(--ink-soft); font-size: 0.82rem; }

  .qa { border-top: 1px solid var(--rule); }
  details { border-bottom: 1px solid var(--rule-soft); }
  summary { cursor: pointer; padding: 0.85rem 0.2rem; font-weight: 570; font-size: 0.98rem; list-style: none; display: flex; gap: 0.7rem; align-items: baseline; }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "+"; color: var(--mark); font-weight: 600; }
  details[open] summary::before { content: "–"; }
  summary:focus-visible { outline: 2px solid var(--mark); outline-offset: -2px; }
  details .body { padding: 0 0.2rem 1rem 1.6rem; font-size: 0.95rem; color: var(--ink-soft); }
  details .body p { margin-bottom: 0.7rem; }
  details .body ul { margin: 0 0 0.7rem; padding-inline-start: 1.1rem; }
  details .body li { margin-bottom: 0.3rem; }
  .missing { display: inline-block; background: var(--mark-soft); color: var(--mark); border: 1px dashed var(--mark); padding: 0.15rem 0.45rem; font-size: 0.76rem; }

  .score { border: 1px solid var(--rule); background: var(--surface); padding: 1.2rem 1.1rem; text-align: center; margin-bottom: 1.3rem; }
  .score .n { font-size: 3rem; font-weight: 600; letter-spacing: -0.03em; line-height: 1; color: var(--mark); }
  .score .l { font-size: 0.8rem; color: var(--ink-faint); letter-spacing: 0.08em; margin-top: 0.3rem; }

  .form { background: var(--surface); border: 1px solid var(--rule); padding: 1.1rem; }
  .form label { display: block; font-size: 0.82rem; color: var(--ink-soft); margin: 0.7rem 0 0.3rem; }
  .form input[type=text], .form input[type=tel] { width: 100%; font: inherit; font-size: 0.95rem; padding: 0.6rem 0.7rem; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); }
  .consent { display: grid; grid-template-columns: auto 1fr; gap: 0.6rem; align-items: start; font-size: 0.85rem; color: var(--ink-soft); margin-top: 0.9rem; }

  .contact { border: 1px solid var(--rule); padding: 1rem 1.1rem; margin-top: 1.3rem; font-size: 0.93rem; }
  .contact div { margin-bottom: 0.5rem; }
  .contact div:last-child { margin-bottom: 0; }
  .contact b { font-weight: 620; }

  .footnote { font-size: 0.82rem; color: var(--ink-faint); margin-top: 1.5rem; border-top: 1px solid var(--rule); padding-top: 0.9rem; }
</style>
</head>
<body>

<div class="phone">
  <div class="demoflag mono">גרסת עבודה · במסלול האמיתי כל תחנה נפתחת בסריקת ברקוד במקומה בבניין</div>
  <div class="bar">
    <span class="who mono" id="crumb">מה הבניין הזה מסתיר</span>
    <span class="pips" id="pips"></span>
  </div>
  <main id="view"></main>
</div>

<script>
(function () {
  "use strict";

  var S = [
    /* ---------------------------------------------------------- 1 */
    {
      type: "slider", key: "eye", name: "גובה העיניים",
      where: "תחנה 1 · ליד סרט המידה בכניסה",
      task: "עמוד צמוד לקיר וסמן את גובה העיניים שלך. כמה יצא?",
      label: "גובה העיניים שלי", unit: 'ס״מ',
      min: 130, max: 195, start: 160, step: 1,
      verdict: function (v) {
        return { head: "קו העין שלך: " + v + " ס״מ",
          text: "כל בניין שהיית בו אי פעם תוכנן סביב המספר הזה של מישהו אחר. מהרגע הזה הגוף שלך הוא הסרגל." };
      },
      facts: function (v) {
        return [
          ["105", "גובה ידית דלת תקנית. נקבע לפי היד, ולכן הוא זהה לכולם — נמוכים וגבוהים."],
          ["210", v >= 210 ? "גובה שילוט הכוונה. אתה קורא אותו ישר."
                           : "גובה שילוט הכוונה. אתה מרים את הראש " + (210 - v) + " ס״מ כדי לקרוא אותו."],
          ["190", v >= 190 ? "מדף עליון במטבח. אתה רואה מה מונח עליו."
                           : "מדף עליון במטבח. אתה לא רואה מה מונח עליו — ולכן, בפועל, לא תשתמש בו."]
        ];
      },
      unlock: { course: "הנדסת אנוש", text: "מקצוע רקע בתוכנית. זה בדיוק מה שהוא עושה: להתאים את המרחב למידות של גוף אמיתי, לפני שמדברים על צבע או על סגנון." }
    },

    /* ---------------------------------------------------------- 2 */
    {
      type: "slider", key: "corridor", name: "המסדרון",
      where: "תחנה 2 · במסדרון הראשי",
      task: "מדוד את רוחב המסדרון בעקב־אצבע, ותרגם לסנטימטרים. כמה יצא?",
      label: "רוחב המסדרון", unit: 'ס״מ',
      min: 80, max: 220, start: 130, step: 5,
      verdict: function (v) {
        if (v < 100) return { head: "צר", text: "שני אנשים עם תיקים לא חולפים כאן זה על פני זה בלי להסתובב." };
        if (v < 120) return { head: "מינימלי", text: "עובר, ולא יותר מזה. ביום עמוס תרגיש את זה." };
        if (v < 150) return { head: "רוחב עבודה נוח", text: "שניים חולפים בלי לחשוב על זה. זה הטווח שרוב המסדרונות מכוונים אליו." };
        return { head: "רחב", text: "נעים — וכל עשרה סנטימטרים כאן נלקחו מהחדרים שמשני הצדדים." };
      },
      facts: function () {
        return [
          ["12 מ׳", "אורך מסדרון ממוצע בקומת מגורים."],
          ["+10 ס״מ", "הרחבה של עשרה סנטימטרים לאורך הזה מוציאה 1.2 מ״ר מהחדרים."],
          ["₪", "באזור ביקוש זה שווה עשרות אלפי שקלים. בגלל זה מסדרונות תמיד צרים — זו החלטה כלכלית, לא אסתטית."]
        ];
      },
      unlock: { course: "תחיקת הבניה והבטיחות", text: "מקצוע רקע בתוכנית. רוחב מסדרון הוא לא העדפה של מתכנן — הוא תנאי לקבלת היתר. הרבה ממה שנראה כמו טעם הוא בעצם חוק." }
    },

    /* ---------------------------------------------------------- 3 */
    {
      type: "text", key: "compromise", name: "איפה מישהו התפשר",
      where: "תחנה 3 · בכל מקום בקומה",
      task: "מצא מקום אחד בקומה הזאת שניכר בו שמישהו נאלץ להתפשר. צלם אותו לעצמך, וכתוב בשורה מה ראית.",
      placeholder: "לדוגמה: צינור שעובר על הקיר במקום בתוכו…",
      verdict: function () {
        return { head: "אין כאן תשובה נכונה", text: "וזה לא ויתור — זו הנקודה. כל בניין הוא רצף פשרות בין מה שרצו, מה שמותר, מה שאפשר לבנות ומה שהיה תקציב עבורו." };
      },
      facts: function () {
        return [
          ["הכי נפוץ", "צנרת או תעלה שעוברת על הקיר במקום בתוכו — כי גילו אותה אחרי שהקירות כבר עמדו."],
          ["אחריו", "דלת שנפתחת פחות ממה שתוכנן, שקע במקום מוזר, מזגן שתלוי מול חלון."],
          ["השורה", "מקצוען הוא לא מי שלא מתפשר. הוא מי שיודע מראש איפה כדאי — ומה זה יעלה אם יגלו את זה מאוחר."]
        ];
      },
      unlock: { course: "עקרונות התכנון האדריכלי", text: "מקצוע התמחות, ומרכז הסטודיו לתכנון. שם לומדים לקבל את ההחלטות האלה בזמן — על הנייר, כשהן עדיין עולות אפס." }
    },

    /* ---------------------------------------------------------- 4 */
    {
      type: "choice", key: "light", name: "מאיפה מגיע האור",
      where: "תחנה 4 · ליד החלון הגדול",
      task: "בלי מצפן ובלי טלפון: לאיזה כיוון פונה החלון הזה? תסתכל על הצללים, על הצד שמתחמם, ועל איפה אנשים בחרו לשבת.",
      options: [
        { v: "n", t: "צפון" }, { v: "s", t: "דרום" },
        { v: "e", t: "מזרח" }, { v: "w", t: "מערב" }
      ],
      verdict: function (v) {
        var m = {
          n: ["צפון", "אור קבוע ורך לאורך כל היום, בלי שמש ישירה ובלי סנוור. בדיוק בגלל זה סטודיו לתכנון מנסים תמיד להפנות צפונה."],
          s: ["דרום", "השמש גבוהה בקיץ ונמוכה בחורף. זה הכיוון היחיד שאפשר להצל עליו במדף אופקי פשוט — וזה חוסך מזגן."],
          e: ["מזרח", "שמש בבוקר, ואז כלום. חדר שמתעורר מוקדם ומתקרר בצהריים."],
          w: ["מערב", "השמש הנמוכה של אחר הצהריים. מסנוורת ומחממת יותר מכל כיוון אחר, והכי קשה להתגונן ממנה."]
        }[v];
        return { head: "ענית: " + m[0], text: m[1] };
      },
      facts: function () {
        return [
          ["הבדיקה", "צל קצר בצהריים = השמש מעליך, כלומר אתה מסתכל דרומה. צל ארוך שנמתח לכיוון אחד = בוקר או אחר צהריים."],
          ["חינם", "כיוון הוא ההחלטה היחידה בתכנון שלא עולה שקל, ומשפיעה על חשבון החשמל של הבניין לכל אורך חייו."],
          ["בבניין הזה", "תסתכל איפה הורידו וילונות ואיפה לא. מישהו כבר ענה על השאלה הזאת בשבילך."]
        ];
      },
      unlock: { course: "תכנון אקלים ובניה ירוקה", text: "מקצוע התמחות בתוכנית, ואחד התפקידים שבוגר יכול לעסוק בהם כיועץ עצמאי." }
    },

    /* ---------------------------------------------------------- 5 */
    {
      type: "choice", key: "wall", name: "מה מאחורי הקיר",
      where: "תחנה 5 · בין שתי הכיתות",
      task: "לפני שאתה נוגע — נחש. איזה מהשניים יישמע חלול כשתדפוק עליו?",
      options: [
        { v: "inner", t: "הקיר שבין שתי הכיתות" },
        { v: "outer", t: "הקיר החיצוני, מול החלון" }
      ],
      answer: "inner",
      verdict: function (v) {
        if (v === "inner") return { head: "נכון", text: "עכשיו תדפוק על שניהם ותשמע את ההבדל. הקיר הפנימי הוא בדרך כלל גבס על שלד מתכת — חלול. החיצוני הוא בלוק או בטון." };
        return { head: "בדרך כלל הפוך", text: "תדפוק על שניהם ותשמע. הקיר החיצוני נושא ואוטם, ולכן הוא מסיבי. דווקא הפנימי הוא זה שחלול." };
      },
      facts: function () {
        return [
          ["גבס", "קיר פנים שאפשר להזיז בכמה מאות שקלים ובכמה ימים."],
          ["בלוק", "קיר שהזזה שלו גוררת הריסה, פינוי פסולת, חשמל ואינסטלציה — פי עשרה ומעלה."],
          ["בטון", "לא זז בכלל. הוא מחזיק את הבניין, וזו התשובה לשאלה ״אפשר לפתוח כאן את הקיר?״ ברוב הדירות."]
        ];
      },
      unlock: { course: "חומרי בנין · פרטי בנין", text: "שני מקצועות התמחות בתוכנית. ההבדל בין שלושת הקירות האלה הוא ההבדל בין שיפוץ שנגמר בזמן לשיפוץ שנתקע." }
    },

      '<h2 style="margin-top:2rem">רוצה שנמשיך?</h2>' +

    document.getElementById("send").onclick = function () { this.textContent = "בגרסה הזו זה לא נשלח"; this.disabled = true; };
