<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מה הבניין הזה מסתיר — מסך כניסה</title>
<style>
  :root { --teal:#009C9C; --yellow:#F5D800; --ink:#0B1414; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; background:var(--ink); overflow:hidden;
    font-family: system-ui, "Segoe UI", "Arial Hebrew", Arial, sans-serif; }

  .screen {
    width:100vw; height:100vh; display:grid; grid-template-columns:1fr 38%;
    align-items:center; gap:4vw; padding:6vh 6vw; color:#fff; position:relative;
  }
  /* the yellow bars of the logo, blown up as the page's own furniture */
  .screen::before, .screen::after {
    content:""; position:absolute; inset-inline:0; height:1.6vh; background:var(--yellow);
  }
  .screen::before { top:0; }
  .screen::after { bottom:0; }

  .left { display:flex; flex-direction:column; }
  .logo { width:15vw; max-width:230px; margin-bottom:4vh; }
  .kick { color:var(--yellow); font-weight:800; letter-spacing:0.16em; font-size:1.7vw; }
  h1 { font-size:7.4vw; line-height:0.98; font-weight:800; letter-spacing:-0.035em; margin:1.6vh 0 0; }
  h1 em { font-style:normal; color:var(--yellow); }
  .lede { font-size:2.05vw; line-height:1.5; margin-top:3.2vh; color:#BFD6D6; max-width:34vw; }
  .meta { display:flex; gap:1vw; margin-top:4vh; flex-wrap:wrap; }
  .chip { background:var(--teal); font-weight:700; font-size:1.5vw;
    padding:0.9vh 1.5vw; border-radius:0.6vw; }

  .right { display:flex; flex-direction:column; align-items:center; }
  .qr { width:26vw; max-width:430px; aspect-ratio:1; background:#fff;
    padding:1.6vw; border-radius:1.4vw; }
  .qr svg { display:block; }
  .cta { margin-top:2.6vh; background:var(--yellow); color:var(--ink);
    font-weight:800; font-size:2.2vw; padding:1.2vh 2.4vw; border-radius:0.6vw;
    animation:pulse 2.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.045); } }
  @media (prefers-reduced-motion: reduce) { .cta { animation:none; } }
  .url { margin-top:1.6vh; font-size:1.15vw; color:#8FB0B0; letter-spacing:0.02em; direction:ltr; }

  /* portrait screens */
  @media (max-aspect-ratio: 1/1) {
    .screen { grid-template-columns:1fr; grid-template-rows:1fr auto; text-align:center; padding:8vh 7vw; }
    .left { align-items:center; }
    .logo { width:30vw; }
    .kick { font-size:3.2vw; }
    h1 { font-size:13vw; }
    .lede { font-size:3.8vw; max-width:80vw; }
    .chip { font-size:3vw; padding:1vh 3vw; border-radius:1.4vw; }
    .qr { width:54vw; padding:3vw; border-radius:3vw; }
    .cta { font-size:4.4vw; padding:1.4vh 5vw; border-radius:1.4vw; }
    .url { font-size:2.4vw; }
  }
</style></head>
